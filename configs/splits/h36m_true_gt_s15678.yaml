# Trains on subjects 1, 5, 6, 7, 8 and validates on the standard test subjects S9/S11.
# This is equivalent to configs/splits/h36m_true_gt_standard.yaml and is provided
# under a descriptive name so that old-vs-standard protocol comparisons use the
# same validation/test set.

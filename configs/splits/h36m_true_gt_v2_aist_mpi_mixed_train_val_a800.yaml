# Mixed-dataset training manifest: H36M true-GT v2 + AIST++ + MPI-INF-3DHP detected-2D.
#
# H36M uses corrected non-circular true mocap world coordinates from
# data/h36m_true_gt_v2/ (standard protocol: S1,S5-S8 train; S9/S11 val).
# AIST++ uses canonical multi-view .npz files under data/webbridge/aistpp_canonical/.
# MPI-INF-3DHP uses RTMPose detected-2D .npz files in metres from
# data/webbridge/mpi_inf_3dhp_detected_2d/.
#
# The manifest is dual-format so it can be consumed both by
# motionflow_mv/data/split_loader.py (train/val/test keys) and by the
# WebBridge mixed loader (train_paths/val_paths + train_names/val_names).
#
# Stable dataset IDs (matches motionflow_mv.data.webbridge_mixed_dataset.DATASET_IDS):
#   h36m -> 0
#   mpi  -> 1
#   aist -> 2

name: H36M True GT v2 + AIST++ + MPI-INF-3DHP Mixed (A800)
description: |
  Three-domain WebBridge manifest for cross-dataset training.
  Train: H36M true-GT v2 (5 subjects) + AIST++ curated subset (14 clips) +
         MPI-INF-3DHP detected-2D (14 sequences, S1/S3-S8).
  Val:   H36M true-GT v2 S9/S11 + AIST++ gWA (2 clips) +
         MPI-INF-3DHP detected-2D S2/Seq1.

dataset_id_map:
  h36m: 0
  mpi: 1
  aist: 2

# Alias keys for split_loader.py (train/val/test lists of file paths)
train:

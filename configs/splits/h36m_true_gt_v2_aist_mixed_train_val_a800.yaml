# Mixed-dataset training manifest: H36M true-GT v2 + AIST++ canonical.
#
# This is the v2 counterpart of configs/splits/h36m_true_gt_aist_mixed_train_val_a800.yaml.
# H36M uses the corrected, non-circular true mocap labels from
# data/h36m_true_gt_v2/ (standard protocol: S1,S5-S8 -> S9/S11).
# AIST++ uses the canonical multi-view .npz under data/webbridge/aistpp_canonical/.
#
# The H36M:AIST train ratio is kept at 5:14 (~26% H36M), matching the v1 mixed
# ablation so that results are comparable across the corrected labels.

name: H36M True GT v2 + AIST++ Mixed (A800)
note: |
  H36M true-GT v2 (S1,5,6,7,8 train; S9,S11 val) mixed with a curated AIST++
  subset (14 train clips from gBR/gWA genres, 2 val clips from gWA).


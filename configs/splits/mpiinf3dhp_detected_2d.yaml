# MPI-INF-3DHP train / val / test split using detected 2D keypoints.
# Units: meters (_m.npz), skeleton: 28 joints (WebBridge canonical MPI order).
#
# Generated by `scripts/generate_mpi_detected_2d.py` which replaces the GT
# `annot2` 2D points with off-the-shelf 2D detections (HRNet / OpenPose stub).
#
# Train: S1, S3-S8 (all sequences)
# Val:   S2/Seq1
# Test:  TS1-TS6 (official test set, separate directory)

train:
  - data/webbridge/mpi_inf_3dhp_detected_2d/s_01_seq_01_v14_multiview_m.npz
  - data/webbridge/mpi_inf_3dhp_detected_2d/s_01_seq_02_v14_multiview_m.npz

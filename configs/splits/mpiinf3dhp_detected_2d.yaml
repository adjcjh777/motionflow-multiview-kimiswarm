  - data/webbridge/mpi_inf_3dhp_detected_2d/s_04_seq_02_v14_multiview_m.npz
  - data/webbridge/mpi_inf_3dhp_detected_2d/s_05_seq_01_v14_multiview_m.npz
  - data/webbridge/mpi_inf_3dhp_detected_2d/s_05_seq_02_v14_multiview_m.npz
  - data/webbridge/mpi_inf_3dhp_detected_2d/s_06_seq_01_v14_multiview_m.npz
  - data/webbridge/mpi_inf_3dhp_detected_2d/s_06_seq_02_v14_multiview_m.npz
  - data/webbridge/mpi_inf_3dhp_detected_2d/s_07_seq_01_v14_multiview_m.npz
  - data/webbridge/mpi_inf_3dhp_detected_2d/s_07_seq_02_v14_multiview_m.npz

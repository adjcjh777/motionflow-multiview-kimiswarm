# Non-circular H36M true-GT split (standard protocol S1,5,6,7,8 -> S9/S11).
# Metre-convention *_m.npz generated from data/h36m_true_gt/ by
# experiments/make_h36m_true_gt_metres.py. Labels come from the VideoPose3D
# official-mocap-derived 3D (issue #194), NOT from DLT triangulation.
# Double acceptance gates passed on 2026-08-10:
#   circularity direct MJE 27,762-37,320 mm (>> 0)
#   reprojection RMSE 3.13-7.15 px (<= 15 px)
# All entries share dataset name 'h36m' (single domain id; the mixed loader
# only accepts names in its SKELETON_MAPS registry).

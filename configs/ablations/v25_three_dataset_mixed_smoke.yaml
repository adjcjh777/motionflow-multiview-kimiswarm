# configs/ablations/v25_three_dataset_mixed_smoke.yaml
#
# Local RTX 4090 smoke for v25 baseline trained jointly on H36M true-GT v2,
# AIST++ canonical multi-view, and MPI-INF-3DHP RTMPose detected-2D.
# Domain IDs: h36m=0, mpi=1, aist=2.

name: v25_three_dataset_mixed_smoke
variant: v25-three-dataset-mixed
version: 25
description: >
  Smoke test for cross-dataset training with the WebBridge mixed loader.
  Uses the lightweight true-GT v2 smoke recipe (d=64, residual_hidden=128,
  n_st_layers=2). Per-domain loss weights: H36M=1.0, MPI=0.2, AIST=1.0.

manifest: configs/splits/h36m_true_gt_v2_aist_mpi_mixed_train_val_a800.yaml
script: experiments/train_omniview_fusion_v5_webbridge_multi.py

training:
  # Mixed-loader / domain settings.
  use_mixed_loader: true
  num_domains: 3
  use_domain_embedding: true
  domain_loss_weights: "1.0,0.2,1.0"

  # Architecture (lightweight smoke recipe).
  d: 64
  residual_hidden: 128
  n_st_layers: 2
  graph_num_layers: 1
  n_joint_layers: 1
  n_heads: 4

  # Smoke schedule.
  clip_len: 9
  epochs: 2
  batch_size: 4
  train_samples: 256
  val_stride: 20
  num_workers: 0

  # Optimisation.
  lr: 1.0e-3
  lr_cosine: true
  lr_warmup_epochs: 1
  lr_min: 1.0e-6
  max_grad_norm: 1.0
  ema_decay: 0.999
  weight_decay: 1.0e-4
  early_stopping_patience: 3
  early_stopping_min_delta: 0.001

  # DLT / reweighting.
  use_full_precision_dlt: true
  use_robust_dlt_reweight: true
  use_irls_reweight: true

  # Standard v5 toggles.
  use_deformable_cross_view_attention_v18: true
  use_multiscale_fusion: true
  use_camera_conditioning: true
  use_epipolar_bias: true
  use_context_visibility: true
  use_skeleton_residual: true
  use_rotation_correction: true
  use_entropy_regularization: true
  attention_entropy_weight: 0.01
  use_camera_view_embedding: true
  use_set_view_aggregator: true

  # v25 geometry fusion.
  use_multiview_geometry_fusion_v25: true
  v25_geom_loss_weight: 0.1
  v25_dropout: 0.2
  v25_use_geometry_attention: true
  v25_use_learned_depth_triangulation: true
  v25_use_geometry_bundle_adjustment: true

  # Loss weights.
  pa_loss_weight: 0.5
  monotonic_loss_weight: 0.1
  monotonic_margin: 5.0
  reproj_loss_weight: 0.1
  reproj_warmup_epochs: 1
  aleatoric_reproj_loss_weight: 0.1

  # Variable-view training.
  use_variable_view_training: true
  variable_view_min_views: 2
  variable_view_max_views: 4
  variable_view_max_views_start: 4
  variable_view_curriculum_alpha: 2.0
  variable_view_permute: true
  outlier_view_prob: 0.3
  outlier_view_max_views: 1
  outlier_view_offset_std: 10.0
  outlier_view_noise_std: 15.0

safety:
  target_hardware: local_rtx_4090_smoke
  notes: >
    Smoke test only (<=30 min). Trains on all three domains with per-domain
    loss weights; inspect per-domain val_MPJPE for domain-gap regressions.

output:
  checkpoint: outputs/omniview_fusion_v25_three_dataset_mixed_smoke_local_4090.pth
  log: outputs/omniview_fusion_v25_three_dataset_mixed_smoke_local_4090.log

notes:
  - "v25 three-dataset mixed smoke: H36M true-GT v2 + AIST++ + MPI detected-2D."
  - "Per-domain loss weights 1.0/0.2/1.0 for h36m/mpi/aist."

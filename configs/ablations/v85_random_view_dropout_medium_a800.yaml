# configs/ablations/v85_random_view_dropout_medium_a800.yaml
#
# A800 medium run for v85 random whole-view dropout on the non-circular
# H36M true-GT standard protocol (S1,5,6,7,8 train -> S9/S11 val).
#
# v85 adds random view dropout + active-view-count embedding to the v25
# stability recipe.  The goal is to make the learned model robust to
# sparse-view inputs (k=2/k=3) without hurting full-view k=4 performance.

name: v85_random_view_dropout_medium_a800
variant: v25-geometry-fusion-random-view-dropout
version: 85
description: >
  Medium-scale A800 run that builds on the v25 stability recipe and adds
  random whole-view dropout with active-view-count embedding.  Designed to
  improve sparse-view (k<4) robustness on the corrected true-GT H36M protocol.

manifest: configs/splits/h36m_true_gt_standard.yaml
script: experiments/train_omniview_fusion_v5_webbridge_multi.py

training:
  # Architecture (matches v25 stability).
  d: 128
  residual_hidden: 256
  n_st_layers: 3
  graph_num_layers: 1
  n_joint_layers: 1
  n_heads: 4

  # Schedule (medium A800).
  clip_len: 13
  epochs: 20
  batch_size: 16
  train_samples: 4096
  val_stride: 20
  num_workers: 4

  # Conservative optimisation from v25 stability.
  lr: 1.0e-4
  lr_cosine: true
  lr_warmup_epochs: 4
  lr_min: 1.0e-6
  max_grad_norm: 1.0
  ema_decay: 0.999
  weight_decay: 1.0e-4
  early_stopping_patience: 3
  early_stopping_min_delta: 0.001

  # DLT / reweighting.
  use_full_precision_dlt: true
  use_robust_dlt_reweight: true
  use_irls_reweight: true

  # Standard v5 / v18 / v25 toggles.
  use_domain_embedding: true
  use_multiscale_fusion: true
  use_camera_conditioning: true
  use_epipolar_bias: true
  use_context_visibility: true
  use_skeleton_residual: true
  use_rotation_correction: true
  use_entropy_regularization: true
  attention_entropy_weight: 0.01
  use_camera_view_embedding: true
  use_set_view_aggregator: true
  use_deformable_cross_view_attention_v18: true

  # v25 geometry fusion.
  use_multiview_geometry_fusion_v25: true
  v25_geom_loss_weight: 0.05
  v25_dropout: 0.2
  v25_use_geometry_attention: true
  v25_use_learned_depth_triangulation: true
  v25_use_geometry_bundle_adjustment: true

  # v85 random view dropout.
  use_random_view_dropout_v85: true
  v85_dropout_prob: 0.3
  v85_min_views: 2
  v85_use_count_embedding: true

  # Loss weights.
  pa_loss_weight: 0.5
  monotonic_loss_weight: 0.1
  monotonic_margin: 5.0
  reproj_loss_weight: 0.1
  reproj_warmup_epochs: 1
  aleatoric_reproj_loss_weight: 0.1

  # Variable-view training (no permutation, matching v25 stability).
  use_variable_view_training: true
  variable_view_min_views: 2
  variable_view_max_views: 4
  variable_view_max_views_start: 4
  variable_view_curriculum_alpha: 2.0
  variable_view_permute: false
  outlier_view_prob: 0.15
  outlier_view_max_views: 1
  outlier_view_offset_std: 10.0
  outlier_view_noise_std: 15.0

safety:
  target_hardware: a800_gpu_4
  notes: >
    Launch only when GPU 4 is free and the local v85 smoke has passed.
    Monitor nvidia-smi and the training log for divergence.

output:
  checkpoint: outputs/ablations/v85_random_view_dropout_medium_a800.pth
  log: outputs/ablations/v85_random_view_dropout_medium_a800.log

notes:
  - "v85: random whole-view dropout + active-view-count embedding on v25 stability."
  - "Goal: improve k=2/k=3 sparse-view robustness while preserving k=4 performance."

# configs/ablations/v87_true_gt_v2_smoke.yaml
#
# Local RTX 4090 smoke for v87 sparse-view residual head on the non-circular
# H36M true-GT v2 standard protocol.

name: v87_true_gt_v2_smoke
variant: v87-sparse-view-residual-head
version: 87
description: >
  Smoke test for v87 sparse-view residual head inserted after triangulation inside
  MultiViewGeometryFusionV25.  Uses the lightweight true-GT v2 smoke recipe
  (d=64, residual_hidden=128, n_st_layers=2).

manifest: configs/splits/h36m_true_gt_v2_standard.yaml
script: experiments/train_omniview_fusion_v5_webbridge_multi.py

training:
  # Architecture (lightweight smoke recipe).
  d: 64
  residual_hidden: 128
  n_st_layers: 2
  graph_num_layers: 1
  n_joint_layers: 1
  n_heads: 4

  # Smoke schedule.
  clip_len: 9
  epochs: 2
  batch_size: 4
  train_samples: 256
  val_stride: 20
  num_workers: 0

  # Optimisation.
  lr: 1.0e-3
  lr_cosine: true
  lr_warmup_epochs: 1
  lr_min: 1.0e-6
  max_grad_norm: 1.0
  ema_decay: 0.999
  weight_decay: 1.0e-4
  early_stopping_patience: 3
  early_stopping_min_delta: 0.001

  # DLT / reweighting.
  use_full_precision_dlt: true
  use_robust_dlt_reweight: true
  use_irls_reweight: true

  # Standard v5 toggles.
  use_domain_embedding: true
  use_multiscale_fusion: true
  use_camera_conditioning: true
  use_epipolar_bias: true
  use_context_visibility: true
  use_skeleton_residual: true
  use_rotation_correction: true
  use_entropy_regularization: true
  attention_entropy_weight: 0.01
  use_camera_view_embedding: true
  use_set_view_aggregator: true
  use_deformable_cross_view_attention_v18: true

  # v25 geometry fusion.
  use_multiview_geometry_fusion_v25: true
  v25_geom_loss_weight: 0.1
  v25_dropout: 0.2
  v25_use_geometry_attention: true
  v25_use_learned_depth_triangulation: true
  v25_use_geometry_bundle_adjustment: true

  # v87 sparse-view residual head.
  use_v87_sparse_view_residual_head: true
  v87_ssvr_head_hidden: 128
  v87_ssvr_head_n_layers: 2
  v87_ssvr_head_dropout: 0.1
  v87_ssvr_head_use_count_embedding: true

  # Loss weights.
  pa_loss_weight: 0.5
  monotonic_loss_weight: 0.1
  monotonic_margin: 5.0
  reproj_loss_weight: 0.1
  reproj_warmup_epochs: 1
  aleatoric_reproj_loss_weight: 0.1

  # Variable-view training so sparse-view branch is exercised.
  use_variable_view_training: true
  variable_view_min_views: 2
  variable_view_max_views: 4
  variable_view_max_views_start: 4
  variable_view_curriculum_alpha: 2.0
  variable_view_permute: true
  outlier_view_prob: 0.3
  outlier_view_max_views: 1
  outlier_view_offset_std: 10.0
  outlier_view_noise_std: 15.0

safety:
  target_hardware: local_rtx_4090_smoke
  notes: >
    Smoke test only (<=30 min).  If validation is stable, scale to the
    medium A800 recipe.

output:
  checkpoint: outputs/omniview_fusion_v87_true_gt_v2_h36m_smoke_local_4090.pth
  log: outputs/omniview_fusion_v87_true_gt_v2_h36m_smoke_local_4090.log

notes:
  - "v87 true-GT v2 smoke: sparse-view residual head after triangulation."
  - "Identity-at-init; should not degrade the v25 baseline at start."

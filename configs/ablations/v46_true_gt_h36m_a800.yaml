# configs/ablations/v46_true_gt_h36m_a800.yaml
#
# A800-D medium run for the v46 Sparse-View Generalization (SVG) baseline on
# the non-circular H36M true-GT standard protocol (S1,5,6,7,8 train -> S9/S11
# val).
#
# This config is paired with:
#   scripts/run_v46_true_gt_h36m_a800.sh
#
# v46-SVG keeps the v45 adaptive geometry-fusion block and adds random view
# dropout plus a per-view reliability head for weighted triangulation under
# missing views.  This run intentionally omits v50/v51/v52/v57/v80 so it can be
# compared cleanly against those later variants on the corrected true-GT
# protocol.

name: v46_h36m_true_gt_medium_a800
variant: v46-SVG
version: 46
description: >
  Medium v46 sparse-view generalization baseline on the corrected H36M true-GT
  protocol.  Uses v45 adaptive geometry fusion plus the v46 view-dropout / SVG
  head, without the v50/v51/v52/v57/v80 extensions.

manifest: configs/splits/h36m_true_gt_standard.yaml
script: experiments/train_omniview_fusion_v5_webbridge_multi.py

training:
  # Architecture (medium scale; fits a single A800 GPU).
  d: 128
  residual_hidden: 256
  n_st_layers: 3
  graph_num_layers: 1
  n_joint_layers: 1
  n_heads: 4

  # Schedule
  clip_len: 13
  epochs: 8
  batch_size: 16
  train_samples: 1024
  val_stride: 20
  num_workers: 0

  # Optimisation
  lr: 1.0e-3
  lr_cosine: true
  lr_warmup_epochs: 1
  lr_min: 1.0e-6
  max_grad_norm: 1.0
  ema_decay: 0.999
  early_stopping_patience: 3
  early_stopping_min_delta: 0.001

  # DLT / reweighting.
  use_full_precision_dlt: true
  use_robust_dlt_reweight: true
  use_irls_reweight: true

  # Standard v5 / v18 / v25 / v30 toggles.
  use_domain_embedding: true
  use_multiscale_fusion: true
  use_camera_conditioning: true
  use_epipolar_bias: true
  use_context_visibility: true
  use_skeleton_residual: true
  use_rotation_correction: true
  use_entropy_regularization: true
  attention_entropy_weight: 0.01
  use_camera_view_embedding: true
  use_set_view_aggregator: true
  use_deformable_cross_view_attention_v18: true

  # v25 geometry fusion (baseline).
  use_multiview_geometry_fusion_v25: true
  v25_geom_loss_weight: 0.1
  v25_dropout: 0.2
  v25_use_geometry_attention: true
  v25_use_learned_depth_triangulation: true
  v25_use_geometry_bundle_adjustment: true

  # v30 hardened hierarchical encoder.
  use_hierarchical_multiview_v30: true
  v30_n_part_layers: 2
  v30_stochastic_depth_prob: 0.1

  # v29 physical-space temporal loss (kept light, warmed up).
  use_physical_space_temporal_loss_v29: true
  v29_floor_loss_weight: 0.01
  v29_bone_temporal_weight: 0.01
  v29_com_jitter_weight: 0.001
  v29_physical_loss_warmup_epochs: 1

  # v45 adaptive geometry fusion.
  use_v45_adaptive_geometry_fusion: true
  v45_adaptive_weight_type: per_view_joint
  v45_adaptive_weight_hidden: 32
  v45_adaptive_weight_n_layers: 1

  # v46 sparse-view generalization (this baseline).
  use_v46_sparse_view_generalization: true
  v46_svg_view_dropout_prob: 0.3
  v46_svg_min_views: 2
  v46_svg_hidden: 64
  v46_svg_use_curriculum: true

  # Loss weights.
  pa_loss_weight: 0.5
  monotonic_loss_weight: 0.1
  monotonic_margin: 5.0
  reproj_loss_weight: 0.1
  reproj_warmup_epochs: 1
  aleatoric_reproj_loss_weight: 0.1

  # Augmentations (H36M has 4 cameras, so cap max views at 4).
  use_variable_view_training: true
  variable_view_min_views: 2
  variable_view_max_views: 4
  variable_view_max_views_start: 4
  variable_view_curriculum_alpha: 2.0
  variable_view_permute: true
  outlier_view_prob: 0.3
  outlier_view_max_views: 1
  outlier_view_offset_std: 10.0
  outlier_view_noise_std: 15.0

safety:
  # TTE is broken and must not be used.
  use_test_time_self_evolution_v27: false
  use_test_time_self_evolution_v29: false

  # Single A800 GPU run.  GPU 4/6 are the preferred queue targets.
  target_hardware: a800_single_gpu

output:
  checkpoint: outputs/ablations/v46_true_gt_h36m_a800.pth
  log: outputs/ablations/v46_true_gt_h36m_a800.log

notes:
  - Trains only on the non-circular H36M true-GT standard protocol.
  - Same medium recipe as v57/v80 (d=128, n_st_layers=3, batch=16, 1024
    samples/epoch, 8 epochs) so the v46 baseline is directly comparable.
  - v50/v51/v52/v57/v80 components are deliberately disabled.
  - TTE remains disabled (known to be broken).

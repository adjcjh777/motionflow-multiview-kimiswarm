# configs/ablations/v25_true_gt_geometry_regularization_a800.yaml
#
# Ablation 2 of 3 for the v25 H36M true-GT divergence, scheduled on A800-D
# instead of the local RTX 4090.
#
# Purpose: In addition to the short-term fixes in
# v25_true_gt_baseline_fix.yaml, add explicit geometry regularisation losses
# that constrain the v25 depth-proposal head (bone-length, joint-limit, and
# temporal-bone losses) and further lower the internal v25 geometry loss weight.
#
# Rationale from the diagnosis:
#   - The v25 depth-proposal head can overfit by distorting 3-D geometry to fit
#     training views.
#   - Bone / joint-limit / temporal-bone losses penalise implausible poses and
#     encourage geometrically consistent predictions.
#
# Key differences from v25_true_gt_baseline_fix.yaml:
#   - bone_loss_weight: 0.05 (was 0.0 / default-off)
#   - joint_limit_weight: 0.01
#   - temporal_bone_weight: 0.005
#   - v25_geom_loss_weight: 0.05 (kept low to avoid internal overfitting)
#
# A800-specific notes:
#   - target_hardware changed to a800_single_gpu
#   - num_workers increased from 0 to 4 to use A800 host CPU
#   - batch_size kept at 16 to stay identical to ablation 1; change only if you
#     also want to scale the learning rate.
#
# IMPORTANT: This file is documentation/reference for the run script. The
# training script currently consumes command-line flags, not this YAML.

name: v25_true_gt_geometry_regularization_a800
variant: v25-geometry-fusion
version: 25
description: >
  Baseline-fix plus explicit geometry regularisation losses on the v25
  depth-proposal head, run on A800-D. Tests whether bone / joint-limit /
  temporal-bone constraints prevent the validation MPJPE explosion after
  epoch 2.

manifest: configs/splits/h36m_true_gt_standard.yaml
script: experiments/train_omniview_fusion_v5_webbridge_multi.py

training:
  # Architecture (medium scale, fits a single A800 GPU).
  d: 128
  residual_hidden: 256
  n_st_layers: 3
  graph_num_layers: 1
  n_joint_layers: 1
  n_heads: 4

  # Schedule
  clip_len: 13
  epochs: 20
  batch_size: 16
  train_samples: 4096
  val_stride: 20
  num_workers: 4

  # Optimisation
  lr: 5.0e-4
  lr_cosine: true
  lr_warmup_epochs: 2
  lr_min: 1.0e-6
  max_grad_norm: 1.0
  ema_decay: 0.999
  weight_decay: 1.0e-4
  early_stopping_patience: 3
  early_stopping_min_delta: 0.001

  # DLT / reweighting.
  use_full_precision_dlt: true
  use_robust_dlt_reweight: true
  use_irls_reweight: true

  # Standard v5 / v18 / v25 toggles.
  use_domain_embedding: true
  use_multiscale_fusion: true
  use_camera_conditioning: true
  use_epipolar_bias: true
  use_context_visibility: true
  use_skeleton_residual: true
  use_rotation_correction: true
  use_entropy_regularization: true
  attention_entropy_weight: 0.01
  use_camera_view_embedding: true
  use_set_view_aggregator: true
  use_deformable_cross_view_attention_v18: true

  # v25 geometry fusion.
  use_multiview_geometry_fusion_v25: true
  v25_geom_loss_weight: 0.05
  v25_dropout: 0.2
  v25_use_geometry_attention: true
  v25_use_learned_depth_triangulation: true
  v25_use_geometry_bundle_adjustment: true

  # Geometry regularisation (this ablation).
  bone_loss_weight: 0.05
  joint_limit_weight: 0.01
  temporal_bone_weight: 0.005

  # Loss weights.
  pa_loss_weight: 0.5
  monotonic_loss_weight: 0.1
  monotonic_margin: 5.0
  reproj_loss_weight: 0.1
  reproj_warmup_epochs: 1
  aleatoric_reproj_loss_weight: 0.1

  # Augmentations (H36M has 4 cameras, so cap max views at 4).
  use_variable_view_training: true
  variable_view_min_views: 2
  variable_view_max_views: 4
  variable_view_max_views_start: 4
  variable_view_curriculum_alpha: 2.0
  variable_view_permute: true
  outlier_view_prob: 0.15
  outlier_view_max_views: 1
  outlier_view_offset_std: 10.0
  outlier_view_noise_std: 15.0

safety:
  target_hardware: a800_single_gpu
  notes: >
    Run on a single free A800 GPU (default GPU 4; override with
    CUDA_VISIBLE_DEVICES). GPU 4/6 are the preferred queue targets. Do not
    launch if another v25 ablation is already running on the chosen GPU.

output:
  checkpoint: outputs/ablations/v25_true_gt_geometry_regularization_a800.pth
  log: outputs/ablations/v25_true_gt_geometry_regularization_a800.log

notes:
  - "Geometry-regularisation ablation on A800. Keep v25_geom_loss_weight low so the internal reprojection term does not dominate."
  - "Best checkpoint should be selected by val_MPJPE, not the final epoch file."
  - "If GPU 4 is busy, run with: CUDA_VISIBLE_DEVICES=6 bash scripts/run_v25_ablation_geometry_regularization_a800.sh"

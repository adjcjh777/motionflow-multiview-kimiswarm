# v25 geometry-loss weight ablation (small)
# Sweeps --v25_geom_loss_weight over {0.01, 0.1, 1.0} while keeping the rest of
# the v25 small configuration fixed. Intended for local RTX 4090 smoke runs.
#
# Run with:
#   python scripts/run_ablation_variants.py --config configs/ablations/v25_geometry_loss_weight_ablation.yaml --dry-run
# Or execute sequentially:
#   bash scripts/run_v25_geometry_loss_weight_ablation.sh

output_dir: outputs/ablations/v25_geometry_loss_weight

base:
  script: experiments/train_omniview_fusion_v5_webbridge_multi.py
  env:
    PYTHONPATH: "."
  args:
    # Data
    --use_mixed_loader: true
    --mixed_manifest: "configs/splits/h36m_true_gt_aist_mixed_train_val_a800.yaml"
    --num_workers: 0

    # Triangulation / robustness
    --use_full_precision_dlt: true
    --use_robust_dlt_reweight: true
    --use_irls_reweight: true
    --use_domain_embedding: true

    # v18 + v25 fusion stack
    --use_deformable_cross_view_attention_v18: true
    --use_multiview_geometry_fusion_v25: true
    --v25_use_geometry_attention: true
    --v25_use_learned_depth_triangulation: true
    --v25_use_geometry_bundle_adjustment: true

    # Architecture
    --d: 128
    --residual_hidden: 256
    --n_st_layers: 3
    --graph_num_layers: 1
    --n_joint_layers: 1
    --n_heads: 4

    # Training (small schedule)
    --epochs: 20
    --batch_size: 16
    --train_samples: 2000
    --val_stride: 10
    --lr: 1.0e-3
    --lr_cosine: true
    --lr_warmup_epochs: 3
    --lr_min: 1.0e-6
    --max_grad_norm: 1.0
    --ema_decay: 0.999

    # Multi-scale / camera / view options
    --use_multiscale_fusion: "true"
    --use_camera_conditioning: "true"
    --use_epipolar_bias: "true"
    --use_context_visibility: "true"
    --use_skeleton_residual: "true"
    --use_rotation_correction: "true"
    --use_entropy_regularization: true
    --attention_entropy_weight: 0.01

    --use_camera_view_embedding: true
    --use_set_view_aggregator: true

    --use_variable_view_training: true
    --variable_view_min_views: 2
    --variable_view_max_views: 14
    --variable_view_max_views_start: 4
    --variable_view_curriculum_alpha: 2.0
    --variable_view_permute: true

    # Losses
    --pa_loss_weight: 0.5
    --monotonic_loss_weight: 0.1
    --monotonic_margin: 5.0
    --reproj_loss_weight: 0.1
    --reproj_warmup_epochs: 3
    --aleatoric_reproj_loss_weight: 0.1

    # Outlier augmentation
    --outlier_view_prob: 0.3
    --outlier_view_max_views: 1
    --outlier_view_offset_std: 10.0
    --outlier_view_noise_std: 15.0

variants:
  - name: v25_geom_w0.01
    args:
      --v25_geom_loss_weight: 0.01
      --output: outputs/ablations/v25_geometry_loss_weight/v25_geom_w0.01.pth

  - name: v25_geom_w0.1
    args:
      --v25_geom_loss_weight: 0.1
      --output: outputs/ablations/v25_geometry_loss_weight/v25_geom_w0.1.pth

  - name: v25_geom_w1.0
    args:
      --v25_geom_loss_weight: 1.0
      --output: outputs/ablations/v25_geometry_loss_weight/v25_geom_w1.0.pth

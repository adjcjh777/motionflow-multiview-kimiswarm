# configs/ablations/v52_true_gt_h36m_a800.yaml
#
# A800-D medium run for v52 Uncertainty-Weighted Triangulation (UWT) on the
# non-circular H36M true-GT standard protocol (S1,5,6,7,8 train -> S9/S11 val).
#
# This is the v52-only ablation: v25 geometry fusion + v45 adaptive geometry
# fusion + v46 sparse-view generalisation + v50 self-evolution feedback head +
# v51 cross-domain sparse-view reliability + v52 UWT.  No v57 DC-PSC and no
# v80 view-reliability weighting, so the effect of the v52 learnable
# triangulation module can be measured in isolation.
#
# Sanity anchors: DLT baseline = S9 29.54 / S11 21.81 mm
# (data/h36m_true_gt/dlt_baseline_h36m.json).

name: v52_true_gt_h36m_a800
variant: v52-UWT
version: 52
description: >
  v52-only ablation on H36M true-GT. Uses the v57 A800 medium recipe but
  removes v57 DC-PSC, so v52 UWT is the only new component beyond the
  v45/v46/v50/v51 stack.

manifest: configs/splits/h36m_true_gt_v2_standard.yaml
script: experiments/train_omniview_fusion_v5_webbridge_multi.py

training:
  # Architecture (matches v57 A800 medium).
  d: 128
  residual_hidden: 256
  n_st_layers: 3
  graph_num_layers: 1
  n_joint_layers: 1
  n_heads: 4

  # Schedule
  clip_len: 13
  epochs: 8
  batch_size: 16
  train_samples: 1024
  val_stride: 20
  num_workers: 4

  # Optimisation
  lr: 1.0e-3
  lr_cosine: true
  lr_warmup_epochs: 1
  lr_min: 1.0e-6
  max_grad_norm: 1.0
  ema_decay: 0.999
  early_stopping_patience: 3
  early_stopping_min_delta: 0.001

  # DLT / reweighting.
  use_full_precision_dlt: true
  use_robust_dlt_reweight: true
  use_irls_reweight: true

  # Standard v5 / v18 toggles.
  use_domain_embedding: true
  use_multiscale_fusion: true
  use_camera_conditioning: true
  use_epipolar_bias: true
  use_context_visibility: true
  use_skeleton_residual: true
  use_rotation_correction: true
  use_entropy_regularization: true
  attention_entropy_weight: 0.01
  use_camera_view_embedding: true
  use_set_view_aggregator: true
  use_deformable_cross_view_attention_v18: true

  # v25 geometry fusion.
  use_multiview_geometry_fusion_v25: true
  v25_geom_loss_weight: 0.1
  v25_dropout: 0.2
  v25_use_geometry_attention: true
  v25_use_learned_depth_triangulation: true
  v25_use_geometry_bundle_adjustment: true

  # v30 hardened hierarchical encoder.
  use_hierarchical_multiview_v30: true
  v30_n_part_layers: 2
  v30_stochastic_depth_prob: 0.1

  # v45 adaptive geometry fusion.
  use_v45_adaptive_geometry_fusion: true
  v45_adaptive_weight_type: per_view_joint
  v45_adaptive_weight_hidden: 32
  v45_adaptive_weight_n_layers: 1

  # v46 sparse-view generalisation.
  use_v46_sparse_view_generalization: true
  v46_svg_view_dropout_prob: 0.3
  v46_svg_min_views: 2
  v46_svg_hidden: 64
  v46_svg_use_curriculum: true

  # v50 self-evolution feedback head.
  use_v50_self_evolution_feedback_head: true
  v50_sefh_hidden: 64
  v50_sefh_num_layers: 2
  v50_sefh_dropout: 0.1
  v50_sefh_loss_weight: 0.0
  v50_sefh_aleatoric_weight: 0.0
  v50_sefh_identity_init_gate: true

  # v51 cross-domain sparse-view reliability.
  use_v51_cross_domain_sparse_view_reliability: true
  v51_cdsvr_hidden: 64
  v51_cdsvr_num_heads: 4
  v51_cdsvr_dropout: 0.1
  v51_cdsvr_offset_min: 0.05
  v51_cdsvr_use_domain_label: true
  v51_cdsvr_uncertainty_temperature: 1.0
  v51_cdsvr_identity_init_gate: true
  v51_cdsvr_loss_weight: 0.0

  # v52 uncertainty-weighted triangulation (main ablation).
  use_v52_uncertainty_weighted_triangulation: true
  v52_uwt_hidden: 64
  v52_uwt_n_layers: 2
  v52_uwt_weight_type: per_view_joint
  v52_uwt_temperature: 1.0
  v52_uwt_use_geometry_bias: true
  v52_uwt_use_feature_bias: true
  v52_uwt_identity_init: true
  v52_uwt_min_weight: 0.05
  v52_uwt_loss_weight: 0.01
  v52_uwt_damping: 1.0e-4
  v52_uwt_warmup_epochs: 0

  # v29 physical-space temporal loss.
  use_physical_space_temporal_loss_v29: true
  v29_floor_loss_weight: 0.01
  v29_bone_temporal_weight: 0.01
  v29_com_jitter_weight: 0.001
  v29_physical_loss_warmup_epochs: 1

  # Loss weights.
  pa_loss_weight: 0.5
  monotonic_loss_weight: 0.1
  monotonic_margin: 5.0
  reproj_loss_weight: 0.1
  reproj_warmup_epochs: 1
  aleatoric_reproj_loss_weight: 0.1

  # Augmentations.
  use_variable_view_training: true
  variable_view_min_views: 2
  variable_view_max_views: 4
  variable_view_max_views_start: 4
  variable_view_curriculum_alpha: 2.0
  variable_view_permute: true
  outlier_view_prob: 0.3
  outlier_view_max_views: 1
  outlier_view_offset_std: 10.0
  outlier_view_noise_std: 15.0

safety:
  # TTE remains disabled (known to be broken).
  use_test_time_self_evolution_v27: false
  use_test_time_self_evolution_v29: false

  target_hardware: a800_single_gpu
  notes: >
    Run on a single free A800 GPU (default GPU 6; override with
    CUDA_VISIBLE_DEVICES). GPUs 6/7 are the only project GPUs. Do not
    launch if another training run is already active on the chosen GPU.

output:
  checkpoint: outputs/ablations/v52_true_gt_h36m_a800.pth
  log: outputs/ablations/v52_true_gt_h36m_a800.log

notes:
  - "v52-only ablation on H36M true-GT."
  - "Best checkpoint is selected by val_MPJPE."
  - "If GPU 4 is busy, run with: CUDA_VISIBLE_DEVICES=6 bash scripts/run_v52_true_gt_h36m_a800.sh"

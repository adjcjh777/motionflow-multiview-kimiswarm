# Example ablation config for scripts/run_ablation_variants.py
# This is a dry-run friendly template; real runs need a dataset and epochs > 0.

output_dir: outputs/ablations/example_kap_ba_sweep

base:
  script: experiments/train_omniview_fusion_v5_webbridge_multi.py
  env:
    PYTHONPATH: "."
  args:
    --use_mixed_loader: true
    --mixed_manifest: "configs/splits/webbridge_h36m_mpi_mixed_train_val.yaml"
    --use_full_precision_dlt: true
    --use_robust_dlt_reweight: true
    --use_irls_reweight: true
    --use_domain_embedding: true
    --use_deformable_cross_view_attention_v18: true
    --use_kinematic_anthropometric_prior_v22: true
    --kap_loss_weight: 0.01
    --num_workers: 0
    --d: 128
    --residual_hidden: 256
    --n_st_layers: 3
    --graph_num_layers: 1
    --n_joint_layers: 1
    --n_heads: 4
    --epochs: 2
    --batch_size: 16
    --train_samples: 2000
    --val_stride: 10
    --lr: 1.0e-3
    --lr_cosine: true
    --lr_warmup_epochs: 3
    --lr_min: 1.0e-6
    --max_grad_norm: 1.0
    --ema_decay: 0.999
    --use_multiscale_fusion: true
    --use_camera_conditioning: true
    --use_epipolar_bias: true
    --use_context_visibility: true
    --use_skeleton_residual: true
    --use_rotation_correction: true
    --use_entropy_regularization: true
    --attention_entropy_weight: 0.01
    --use_camera_view_embedding: true
    --use_set_view_aggregator: true

variants:
  - name: v23_kap_no_ba
    args:
      --use_neural_bundle_adjustment_v21: false
      --output: outputs/ablations/example_kap_ba_sweep/v23_kap_no_ba.pth

  - name: v24_kap_fixed_ba
    args:
      --use_neural_bundle_adjustment_v21: true
      --output: outputs/ablations/example_kap_ba_sweep/v24_kap_fixed_ba.pth

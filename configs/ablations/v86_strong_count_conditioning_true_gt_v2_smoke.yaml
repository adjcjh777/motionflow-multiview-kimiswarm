# configs/ablations/v86_strong_count_conditioning_true_gt_v2_smoke.yaml
#
# Local RTX 4090 smoke for v86: stronger explicit view-count token / MLP
# conditioning on top of the v85 random whole-view dropout recipe, evaluated on
# the corrected H36M true-GT v2 protocol.

name: v86_strong_count_conditioning_true_gt_v2_smoke
variant: v25-geometry-fusion-strong-count-conditioning
version: 86
description: >
  Smoke test for v86 strong count conditioning.  Replaces the simple
  active-view-count embedding with an explicit MLP-generated count token while
  keeping v85's random whole-view dropout.  Uses the true-GT v2 standard
  protocol and the lightweight smoke recipe (2 epochs, 256 train samples).

manifest: configs/splits/h36m_true_gt_v2_standard.yaml
script: experiments/train_omniview_fusion_v5_webbridge_multi.py

training:
  # Architecture (matches v25 stability / v85 for a fair smoke comparison).
  d: 128
  residual_hidden: 256
  n_st_layers: 3
  graph_num_layers: 1
  n_joint_layers: 1
  n_heads: 4

  # Smoke schedule.
  clip_len: 9
  epochs: 2
  batch_size: 4
  train_samples: 256
  val_stride: 20
  num_workers: 0

  # Optimisation.
  lr: 1.0e-4
  lr_cosine: true
  lr_warmup_epochs: 1
  lr_min: 1.0e-6
  max_grad_norm: 1.0
  ema_decay: 0.999
  weight_decay: 1.0e-4
  early_stopping_patience: 3
  early_stopping_min_delta: 0.001

  # DLT / reweighting.
  use_full_precision_dlt: true
  use_robust_dlt_reweight: true
  use_irls_reweight: true

  # Standard v5 / v18 / v25 toggles.
  use_domain_embedding: true
  use_multiscale_fusion: true
  use_camera_conditioning: true
  use_epipolar_bias: true
  use_context_visibility: true
  use_skeleton_residual: true
  use_rotation_correction: true
  use_entropy_regularization: true
  attention_entropy_weight: 0.01
  use_camera_view_embedding: true
  use_set_view_aggregator: true
  use_deformable_cross_view_attention_v18: true

  # v25 geometry fusion.
  use_multiview_geometry_fusion_v25: true
  v25_geom_loss_weight: 0.05
  v25_dropout: 0.2
  v25_use_geometry_attention: true
  v25_use_learned_depth_triangulation: true
  v25_use_geometry_bundle_adjustment: true

  # v85 random whole-view dropout (kept; simple count embedding disabled).
  use_random_view_dropout_v85: true
  v85_dropout_prob: 0.3
  v85_min_views: 2
  v85_use_count_embedding: false

  # v86 stronger explicit view-count token / MLP conditioning.
  use_v86_strong_count_conditioning: true
  v86_count_hidden: 64
  v86_count_n_layers: 2
  v86_count_dropout: 0.1

  # Loss weights.
  pa_loss_weight: 0.5
  monotonic_loss_weight: 0.1
  monotonic_margin: 5.0
  reproj_loss_weight: 0.1
  reproj_warmup_epochs: 1
  aleatoric_reproj_loss_weight: 0.1

  # Variable-view training.
  use_variable_view_training: true
  variable_view_min_views: 2
  variable_view_max_views: 4
  variable_view_max_views_start: 4
  variable_view_curriculum_alpha: 2.0
  variable_view_permute: true
  outlier_view_prob: 0.15
  outlier_view_max_views: 1
  outlier_view_offset_std: 10.0
  outlier_view_noise_std: 15.0

safety:
  target_hardware: local_rtx_4090_smoke
  notes: >
    Smoke test only (<=30 min).  If validation is stable, scale to the
    medium A800 recipe.

output:
  checkpoint: outputs/v86_strong_count_conditioning_true_gt_v2_h36m_smoke_local_4090.pth
  log: outputs/v86_strong_count_conditioning_true_gt_v2_h36m_smoke_local_4090.log

notes:
  - "v86 true-GT v2 smoke: stronger explicit view-count token / MLP conditioning."
  - "Goal: reproduce the v85/v86 smoke behaviour and confirm stable training."

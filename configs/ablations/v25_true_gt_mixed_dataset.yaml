# configs/ablations/v25_true_gt_mixed_dataset.yaml
#
# Ablation 3 of 3 for the v25 H36M true-GT divergence documented in
# docs/v25_divergence_diagnosis.md.
#
# Purpose: Same short-term hyperparameter fixes as
# v25_true_gt_baseline_fix.yaml, but train on the H36M+MPI-INF-3DHP mixed
# loader instead of H36M true-GT only. Tests whether data diversity (larger
# effective training set) removes the overfit.
#
# Key differences from v25_true_gt_baseline_fix.yaml:
#   - mixed_manifest: configs/splits/h36m_true_gt_aist_mixed_train_val_a800.yaml
#   - domain_embedding is enabled so the model can distinguish H36M and MPI domains.
#   - variable_view_max_views: 14 (MPI has more cameras; cap via curriculum start at 4).
#
# IMPORTANT: This file is documentation/reference for the run script. The
# training script currently consumes command-line flags, not this YAML.

name: v25_true_gt_mixed_dataset
variant: v25-geometry-fusion
version: 25
description: >
  Baseline-fix but using the H36M+MPI-INF-3DHP mixed loader. The model still
  validates on the H36M true-GT val split, but trains on a much larger and more
  diverse set of multi-view frames.

manifest: configs/splits/h36m_true_gt_aist_mixed_train_val_a800.yaml
script: experiments/train_omniview_fusion_v5_webbridge_multi.py

training:
  # Architecture (medium scale, fits a single local RTX 4090).
  d: 128
  residual_hidden: 256
  n_st_layers: 3
  graph_num_layers: 1
  n_joint_layers: 1
  n_heads: 4

  # Schedule
  clip_len: 13
  epochs: 20
  batch_size: 16
  train_samples: 4096
  val_stride: 20
  num_workers: 0

  # Optimisation
  lr: 5.0e-4
  lr_cosine: true
  lr_warmup_epochs: 2
  lr_min: 1.0e-6
  max_grad_norm: 1.0
  ema_decay: 0.999
  weight_decay: 1.0e-4
  early_stopping_patience: 3
  early_stopping_min_delta: 0.001

  # DLT / reweighting.
  use_full_precision_dlt: true
  use_robust_dlt_reweight: true
  use_irls_reweight: true

  # Standard v5 / v18 / v25 toggles.
  use_domain_embedding: true
  use_multiscale_fusion: true
  use_camera_conditioning: true
  use_epipolar_bias: true
  use_context_visibility: true
  use_skeleton_residual: true
  use_rotation_correction: true
  use_entropy_regularization: true
  attention_entropy_weight: 0.01
  use_camera_view_embedding: true
  use_set_view_aggregator: true
  use_deformable_cross_view_attention_v18: true

  # v25 geometry fusion.
  use_multiview_geometry_fusion_v25: true
  v25_geom_loss_weight: 0.05
  v25_dropout: 0.2
  v25_use_geometry_attention: true
  v25_use_learned_depth_triangulation: true
  v25_use_geometry_bundle_adjustment: true

  # Loss weights.
  pa_loss_weight: 0.5
  monotonic_loss_weight: 0.1
  monotonic_margin: 5.0
  reproj_loss_weight: 0.1
  reproj_warmup_epochs: 1
  aleatoric_reproj_loss_weight: 0.1

  # Augmentations.
  use_variable_view_training: true
  variable_view_min_views: 2
  variable_view_max_views: 14
  variable_view_max_views_start: 4
  variable_view_curriculum_alpha: 2.0
  variable_view_permute: true
  outlier_view_prob: 0.15
  outlier_view_max_views: 1
  outlier_view_offset_std: 10.0
  outlier_view_noise_std: 15.0

safety:
  target_hardware: local_rtx_4090_medium
  notes: >
    Run only when the local RTX 4090 is free; the project allows at most one
    concurrent training task on this GPU.

output:
  checkpoint: outputs/ablations/v25_true_gt_mixed_dataset.pth
  log: outputs/ablations/v25_true_gt_mixed_dataset.log

notes:
  - "Mixed-dataset ablation. Validation still uses H36M true-GT S9/S11."
  - "Best checkpoint should be selected by val_MPJPE, not the final epoch file."

# v31: physical_bone_only_warmup
# Smoke/full launch settings for the v31 ablation.  Pass these flags to
# experiments/train_omniview_fusion_v5_webbridge_multi.py.
name: v31_physical_bone_only_warmup
base: v30_hierarchical_smoke
description: >
  v30 hierarchical encoder with PhysicalSpaceTemporalLossV29 restricted to the
  bone-temporal smoothness term only, plus a linear warmup.  Floor and
  COM-jitter terms are disabled.  TTE is not used.

# Core physical-loss flags for this variant
physical_loss:
  use_physical_space_temporal_loss_v29: true
  v29_floor_loss_weight: 0.0
  v29_bone_temporal_weight: 0.01
  v29_com_jitter_weight: 0.0
  v29_physical_loss_warmup_epochs: 3

# Encoder and geometry-fusion flags (mirrors v30 smoke)
model:
  use_hierarchical_multiview_v30: true
  v30_n_part_layers: 2
  v30_stochastic_depth_prob: 0.1
  use_multiview_geometry_fusion_v25: true
  v25_geom_loss_weight: 0.1
  v25_dropout: 0.2
  v25_use_geometry_attention: true
  v25_use_learned_depth_triangulation: true
  v25_use_geometry_bundle_adjustment: true
  use_deformable_cross_view_attention_v18: true

# TTE is explicitly disabled
tte:
  use_test_time_self_evolution_v29: false

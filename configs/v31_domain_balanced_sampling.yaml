# v31 domain-balanced sampling smoke configuration
# This file documents the hyperparameters used by the v31 ablation.
# The actual training run is launched by:
#   bash scripts/launch_v31_domain_balanced_sampling_local4090.sh
# which invokes the wrapper trainer that swaps in DomainBalancedSampler.

experiment: v31_domain_balanced_sampling
wrapper_script: experiments/train_omniview_fusion_v5_webbridge_multi_v31_domain_balanced.py
launch_script: scripts/launch_v31_domain_balanced_sampling_local4090.sh
split_manifest: configs/splits/h36m_true_gt_aist_mixed_train_val_a800.yaml

domain_balanced_sampling:
  enabled: true
  sampler_module: motionflow_mv.data.domain_balanced_sampler
  resample_short_domains: true
  seed: 42

model:
  d: 64
  residual_hidden: 128
  n_st_layers: 2
  graph_num_layers: 1
  n_joint_layers: 1
  n_heads: 4
  use_domain_embedding: true
  use_deformable_cross_view_attention_v18: true
  use_multiview_geometry_fusion_v25: true
  v25_geom_loss_weight: 0.1
  v25_dropout: 0.2
  use_hierarchical_multiview_v30: true
  v30_n_part_layers: 2
  v30_stochastic_depth_prob: 0.1

training:
  clip_len: 9
  epochs: 3
  batch_size: 4
  train_samples: 200
  val_stride: 10
  lr: 1.0e-3
  lr_cosine: true
  lr_warmup_epochs: 1
  lr_min: 1.0e-6
  max_grad_norm: 1.0
  ema_decay: 0.999
  early_stopping_patience: 2
  early_stopping_min_delta: 0.001

losses:
  use_physical_space_temporal_loss_v29: true
  v29_floor_loss_weight: 0.01
  v29_bone_temporal_weight: 0.01
  v29_com_jitter_weight: 0.001
  v29_physical_loss_warmup_epochs: 2
  pa_loss_weight: 0.5
  monotonic_loss_weight: 0.1
  monotonic_margin: 5.0
  reproj_loss_weight: 0.1
  reproj_warmup_epochs: 1
  aleatoric_reproj_loss_weight: 0.1
  attention_entropy_weight: 0.01

augmentation:
  use_variable_view_training: true
  variable_view_min_views: 2
  variable_view_max_views: 8
  variable_view_max_views_start: 4
  variable_view_curriculum_alpha: 2.0
  variable_view_permute: true
  outlier_view_prob: 0.3
  outlier_view_max_views: 1
  outlier_view_offset_std: 10.0
  outlier_view_noise_std: 15.0

hardware:
  device: local_rtx_4090
  num_workers: 0

notes:
  - TTE remains disabled (known to be broken).
  - Physical loss is warmed up for 2 epochs to avoid v28-style instability.
  - This is a smoke config only; full A800 runs should scale d/residual_hidden and epochs.

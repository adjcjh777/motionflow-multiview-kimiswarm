# v31 physical_all_low_weights ablation config
# Runs on local RTX 4090 smoke settings for fast feedback.
#
# Usage:
#   python scripts/run_ablation_variants.py --config configs/v31_physical_all_low_weights.yaml --dry-run
#   python scripts/run_ablation_variants.py --config configs/v31_physical_all_low_weights.yaml

output_dir: outputs/ablations/v31_physical_all_low_weights

base:
  script: experiments/train_omniview_fusion_v5_webbridge_multi.py
  env:
    PYTHONPATH: "."
  args:
    # Data
    --use_mixed_loader: true
    --mixed_manifest: "configs/splits/h36m_true_gt_aist_mixed_train_val_a800.yaml"
    --num_workers: 0

    # Triangulation / robustness
    --use_full_precision_dlt: true
    --use_robust_dlt_reweight: true
    --use_irls_reweight: true
    --use_domain_embedding: true

    # v18 + v25 fusion stack
    --use_deformable_cross_view_attention_v18: true
    --use_multiview_geometry_fusion_v25: true
    --v25_geom_loss_weight: 0.1
    --v25_dropout: 0.2
    --v25_use_geometry_attention: true
    --v25_use_learned_depth_triangulation: true
    --v25_use_geometry_bundle_adjustment: true

    # Architecture (smoke)
    --d: 64
    --residual_hidden: 128
    --n_st_layers: 2
    --graph_num_layers: 1
    --n_joint_layers: 1
    --n_heads: 4

    # Training (smoke schedule)
    --clip_len: 9
    --epochs: 3
    --batch_size: 4
    --train_samples: 200
    --val_stride: 10
    --lr: 1.0e-3
    --lr_cosine: true
    --lr_warmup_epochs: 1
    --lr_min: 1.0e-6
    --max_grad_norm: 1.0
    --ema_decay: 0.999
    --early_stopping_patience: 2
    --early_stopping_min_delta: 0.001

    # Multi-scale / camera / view options
    --use_multiscale_fusion: "true"
    --use_camera_conditioning: "true"
    --use_epipolar_bias: "true"
    --use_context_visibility: "true"
    --use_skeleton_residual: "true"
    --use_rotation_correction: "true"
    --use_entropy_regularization: true
    --attention_entropy_weight: 0.01

    --use_camera_view_embedding: true
    --use_set_view_aggregator: true

    --use_variable_view_training: true
    --variable_view_min_views: 2
    --variable_view_max_views: 8
    --variable_view_max_views_start: 4
    --variable_view_curriculum_alpha: 2.0
    --variable_view_permute: true

    # Losses
    --pa_loss_weight: 0.5
    --monotonic_loss_weight: 0.1
    --monotonic_margin: 5.0
    --reproj_loss_weight: 0.1
    --reproj_warmup_epochs: 1
    --aleatoric_reproj_loss_weight: 0.1

    # Outlier augmentation
    --outlier_view_prob: 0.3
    --outlier_view_max_views: 1
    --outlier_view_offset_std: 10.0
    --outlier_view_noise_std: 15.0

    # v30 hierarchical encoder
    --use_hierarchical_multiview_v30: true
    --v30_n_part_layers: 2
    --v30_stochastic_depth_prob: 0.1

    # v29 physical-space temporal loss (low weights variant)
    --use_physical_space_temporal_loss_v29: true
    --v29_floor_loss_weight: 0.001
    --v29_bone_temporal_weight: 0.001
    --v29_com_jitter_weight: 0.0001
    --v29_physical_loss_warmup_epochs: 2

variants:
  - name: v31_physical_all_low_weights_smoke
    args:
      --output: outputs/omniview_fusion_v31_physical_all_low_weights_smoke_local_4090.pth

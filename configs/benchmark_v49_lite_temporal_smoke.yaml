# Smoke-test configuration for the v49-Lite lightweight temporal aggregation variant.
# Runs on the local RTX 4090 and uses a causal Conv1D temporal head instead of the
# v47 transformer.
name: v49_lite_temporal_smoke
variant: v49-Lite

description: >
  Smoke test for v49-Lite lightweight temporal aggregation.  Builds on the
  v46-SVG baseline and replaces the v47 transformer with a small causal
  depthwise-separable Conv1D stack to save memory and latency on RTX 4090.

manifest: configs/splits/webbridge_h36m_mpi_mixed_train_val.yaml
script: experiments/train_omniview_fusion_v5_webbridge_multi.py

training:
  d: 64
  residual_hidden: 128
  n_st_layers: 2
  graph_num_layers: 1
  n_joint_layers: 1
  n_heads: 4

  clip_len: 9
  epochs: 2
  batch_size: 4
  train_samples: 500
  val_stride: 10
  num_workers: 0

  lr: 1.0e-3
  lr_cosine: true
  lr_warmup_epochs: 1
  lr_min: 1.0e-6
  max_grad_norm: 1.0
  ema_decay: 0.999
  early_stopping_patience: 2
  early_stopping_min_delta: 0.001

  use_multiview_geometry_fusion_v25: true
  v25_geom_loss_weight: 0.1
  v25_dropout: 0.2
  v25_use_geometry_attention: true
  v25_use_learned_depth_triangulation: true
  v25_use_geometry_bundle_adjustment: true

  use_v45_adaptive_geometry_fusion: true
  v45_adaptive_weight_type: per_view_joint
  v45_adaptive_weight_hidden: 32
  v45_adaptive_weight_n_layers: 1

  use_v46_sparse_view_generalization: true
  v46_svg_view_dropout_prob: 0.3
  v46_svg_min_views: 2
  v46_svg_hidden: 64
  v46_svg_use_curriculum: true

  use_v49_lite_temporal_aggregation: true
  v49_lite_temporal_d_model: 32
  v49_lite_temporal_num_layers: 2
  v49_lite_temporal_kernel_size: 3
  v49_lite_temporal_dropout: 0.1
  v49_lite_temporal_residual_gate_init: 0.0
  v49_lite_temporal_use_view_count_conditioning: true
  v49_lite_temporal_loss_weight: 0.01

  pa_loss_weight: 0.5
  monotonic_loss_weight: 0.1
  monotonic_margin: 5.0
  reproj_loss_weight: 0.1
  reproj_warmup_epochs: 1
  aleatoric_reproj_loss_weight: 0.1

  use_variable_view_training: true
  variable_view_min_views: 2
  variable_view_max_views: 8
  variable_view_max_views_start: 4
  variable_view_curriculum_alpha: 2.0
  variable_view_permute: true
  outlier_view_prob: 0.3
  outlier_view_max_views: 1
  outlier_view_offset_std: 10.0
  outlier_view_noise_std: 15.0

safety:
  use_test_time_self_evolution_v27: false
  use_test_time_self_evolution_v29: false
  target_hardware: local_rtx_4090_smoke

output:
  checkpoint: outputs/omniview_fusion_v49_lite_temporal_smoke_local_4090.pth
  log: outputs/v49_lite_temporal_smoke_local_4090.log

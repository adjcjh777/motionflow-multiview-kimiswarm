# v31 uncertainty-depth-reweight smoke configuration
# Reference: docs/proposals/v31_uncertainty_depth_reweight.md
#
# This YAML documents the hyperparameters used by the v31 smoke test.
# The training script is invoked via CLI in
# scripts/launch_v31_uncertainty_depth_reweight_local4090.sh.

name: v31_uncertainty_depth_reweight_smoke
split_manifest: configs/splits/h36m_true_gt_aist_mixed_smoke.yaml

model:
  base: v30_hierarchical_encoder
  geometry_fusion: v25_with_v27_uncertainty_depth_proposals
  d: 64
  residual_hidden: 128
  n_st_layers: 2
  graph_num_layers: 1
  n_joint_layers: 1
  n_heads: 4
  n_views: 14  # padded mixed-dataset max views

v27_uncertainty_depth_proposals:
  enabled: true
  n_mixtures: 1
  uncertainty_loss_weight: 0.01

v30_hierarchical_encoder:
  enabled: true
  n_part_layers: 2
  stochastic_depth_prob: 0.1

v29_physical_space_temporal_loss:
  enabled: true
  floor_loss_weight: 0.01
  bone_temporal_weight: 0.01
  com_jitter_weight: 0.001
  warmup_epochs: 1

training:
  epochs: 3
  batch_size: 4
  clip_len: 9
  train_samples: 200
  val_stride: 10
  lr: 1.0e-3
  lr_cosine: true
  lr_warmup_epochs: 1
  lr_min: 1.0e-6
  max_grad_norm: 1.0
  ema_decay: 0.999
  early_stopping_patience: 2
  early_stopping_min_delta: 0.001

augmentation:
  outlier_view_prob: 0.3
  outlier_view_max_views: 1
  outlier_view_offset_std: 10.0
  outlier_view_noise_std: 15.0
  variable_view_training:
    enabled: true
    min_views: 2
    max_views: 8
    max_views_start: 4
    curriculum_alpha: 2.0
    permute: true

loss_weights:
  v25_geom_loss: 0.1
  pa_loss: 0.5
  monotonic_loss: 0.1
  reproj_loss: 0.1
  aleatoric_reproj_loss: 0.1
  attention_entropy: 0.01

notes: |
  This is a smoke configuration for the local RTX 4090.  It enables the v30
  hierarchical encoder and v27 uncertainty depth proposals, which is the
  base that v31 uncertainty-depth reweighting builds on.  The actual
  reweighting gate (sigma_bar -> w_sigma) is described in the proposal and
  requires a source change in uncertainty_depth_proposal_v27.py.
